name: GenuineGigs CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend
        run: python -m pip install -e 'apps/api[dev]'
      - name: Install frontend
        run: npm ci
      - name: Backend lint
        run: ruff check apps/api/app apps/api/tests
      - name: Backend tests
        working-directory: apps/api
        run: pytest -q
      - name: Migration smoke test
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:////tmp/genuinegigs-ci-migration.db
        run: alembic upgrade head
      - name: OpenAPI contract
        working-directory: apps/api
        run: python scripts/check_openapi_contract.py
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend production build
        run: npm run build:web

