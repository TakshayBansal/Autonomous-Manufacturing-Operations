[project]
name = "genuinegigs-api"
version = "1.0.0"
description = "FastAPI service for the GenuineGigs Manufacturing Agent OS."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139.2,<0.140.0",
  "starlette>=1.3.1,<1.4.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "argon2-cffi>=23.1.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "celery[redis]>=5.4.0",
  "boto3>=1.35.0",
  "httpx>=0.28.0",
  "httpx2>=2.10.0,<3.0.0",
  "openpyxl>=3.1.5",
  "pypdf>=5.1.0",
  "reportlab>=4.2.5",
  "pillow>=11.0.0",
  "pytesseract>=0.3.13",
  "pdf2image>=1.17.0",
  "prometheus-client>=0.21.0",
  "langgraph>=1.2.9,<1.3.0",
  "langchain-core>=1.5.1,<1.6.0",
  "langchain-groq>=1.1.3,<1.2.0",
  "groq>=0.37.1,<0.38.0",
  "pyotp>=2.9.0",
  "pgvector>=0.3.6",
  "cryptography>=44.0.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-instrumentation-celery>=0.50b0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "httpx2>=2.10.0,<3.0.0",
  "ruff>=0.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
