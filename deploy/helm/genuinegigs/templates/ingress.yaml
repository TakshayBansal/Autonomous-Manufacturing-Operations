{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "genuinegigs.name" . }}
  labels:
    {{- include "genuinegigs.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts: [{{ .Values.ingress.webHost | quote }}, {{ .Values.ingress.apiHost | quote }}]
  rules:
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "genuinegigs.name" . }}-web
                port: {name: http}
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "genuinegigs.name" . }}-api
                port: {name: http}
{{- end }}
